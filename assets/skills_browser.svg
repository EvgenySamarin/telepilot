<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075.5 762.0" width="1075.5" height="762.0">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13px; font-variant-ligatures: none; }
  </style>
  <rect width="100%" height="100%" fill="#0d1117"/>
  <g transform="translate(25.0, 20.0)" filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13">
    <!-- Window Body -->
    <rect width="1025.5" height="712.0" rx="10" ry="10" fill="#1a1b26" stroke="#292e42" stroke-width="1"/>
    <!-- Title Bar -->
    <path d="M 0,10 A 10,10 0 0 1 10,0 L 1015.5,0 A 10,10 0 0 1 1025.5,10 L 1025.5,44.0 L 0,44.0 Z" fill="#16161e"/>
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="6" fill="#f7768e"/>
    <circle cx="38" cy="18" r="6" fill="#e0af68"/>
    <circle cx="56" cy="18" r="6" fill="#9ece6a"/>
    <!-- Window Title -->
    <text x="512.8" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#7aa2f7" font-weight="600" text-anchor="middle">telepilot — Per-Chat AI Instructions &amp; Modular Skills (.agents/skills)</text>
    <text class="mono" x="24.0" y="57.5" xml:space="preserve"></text>
    <text class="mono" x="24.0" y="75.5" xml:space="preserve"></text>
    <text class="mono" x="24.0" y="93.5" xml:space="preserve"></text>
    <text class="mono" x="24.0" y="111.5" xml:space="preserve"><tspan x="196.0" y="111.5" fill="#79a2f7">╔══════════════════════════════════════════════════════════════════════════════╗</tspan></text>
    <text class="mono" x="24.0" y="129.5" xml:space="preserve"><tspan x="196.0" y="129.5" fill="#79a2f7">║</tspan><tspan x="813.8" y="129.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="147.5" xml:space="preserve"><tspan x="196.0" y="147.5" fill="#79a2f7">║</tspan><tspan x="219.5" y="147.5" fill="#7dcfff" font-weight="bold">─TelePilot (tgp) Vim Keyboard Shortcuts─</tspan><tspan x="813.8" y="147.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="165.5" xml:space="preserve"><tspan x="196.0" y="165.5" fill="#79a2f7">║</tspan><tspan x="813.8" y="165.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="183.5" xml:space="preserve"><tspan x="196.0" y="183.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="183.5" fill="#a9b1d6">    1 - 4               : Switch tabs (1:Live Chat, 2:AI &amp; Skills, 3:Period   </tspan><tspan x="813.8" y="183.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="201.5" xml:space="preserve"><tspan x="196.0" y="201.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="201.5" fill="#a9b1d6">  Archive, 4:Trace)                                                           </tspan><tspan x="813.8" y="201.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="219.5" xml:space="preserve"><tspan x="196.0" y="219.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="219.5" fill="#a9b1d6">    Tab / h / l         : Switch focus between Chats sidebar and Main window  </tspan><tspan x="813.8" y="219.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="237.5" xml:space="preserve"><tspan x="196.0" y="237.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="237.5" fill="#a9b1d6">    j / k or Up/Dn      : Move cursor down / up or scroll active view         </tspan><tspan x="813.8" y="237.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="255.5" xml:space="preserve"><tspan x="196.0" y="255.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="255.5" fill="#a9b1d6">    g / G, Ctrl+d/Ctrl+u: Jump to top/bottom or half-page scroll              </tspan><tspan x="813.8" y="255.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="273.5" xml:space="preserve"><tspan x="196.0" y="273.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="273.5" fill="#a9b1d6">    Enter / Space (Chat): Select &amp; open chat in Tab 1 (single-chat            </tspan><tspan x="813.8" y="273.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="291.5" xml:space="preserve"><tspan x="196.0" y="291.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="291.5" fill="#a9b1d6">  selection)                                                                  </tspan><tspan x="813.8" y="291.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="309.5" xml:space="preserve"><tspan x="196.0" y="309.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="309.5" fill="#a9b1d6">    i / Enter (Tab 1)   : Compose message in live chat (Enter to send, Esc    </tspan><tspan x="813.8" y="309.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="327.5" xml:space="preserve"><tspan x="196.0" y="327.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="327.5" fill="#a9b1d6">  to cancel)                                                                  </tspan><tspan x="813.8" y="327.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="345.5" xml:space="preserve"><tspan x="196.0" y="345.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="345.5" fill="#a9b1d6">    v (Tab 1 / 2 / 3)   : Play voice / QuickLook media on-demand / Preview    </tspan><tspan x="813.8" y="345.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="363.5" xml:space="preserve"><tspan x="196.0" y="363.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="363.5" fill="#a9b1d6">  skill                                                                       </tspan><tspan x="813.8" y="363.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="381.5" xml:space="preserve"><tspan x="196.0" y="381.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="381.5" fill="#a9b1d6">    Enter (Tab 2)       : Enable highlighted summary skill for active chat    </tspan><tspan x="813.8" y="381.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="399.5" xml:space="preserve"><tspan x="196.0" y="399.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="399.5" fill="#a9b1d6">  ([AI])                                                                      </tspan><tspan x="813.8" y="399.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="417.5" xml:space="preserve"><tspan x="196.0" y="417.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="417.5" fill="#a9b1d6">    x (Tab 2)           : Disable/clear AI instructions for active chat       </tspan><tspan x="813.8" y="417.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="435.5" xml:space="preserve"><tspan x="196.0" y="435.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="435.5" fill="#a9b1d6">    m (Tab 2 / 3)       : Edit per-chat AI notes / instructions               </tspan><tspan x="813.8" y="435.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="453.5" xml:space="preserve"><tspan x="196.0" y="453.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="453.5" fill="#a9b1d6">    e / n (Tab 2)       : Edit skill in $EDITOR (e) or create new skill (n)   </tspan><tspan x="813.8" y="453.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="471.5" xml:space="preserve"><tspan x="196.0" y="471.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="471.5" fill="#a9b1d6">    r (Tab 1 / 2 / 3)   : Refresh live chat (Tab 1) or Run AI period parse    </tspan><tspan x="813.8" y="471.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="489.5" xml:space="preserve"><tspan x="196.0" y="489.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="489.5" fill="#a9b1d6">  (Tab 2/3)                                                                   </tspan><tspan x="813.8" y="489.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="507.5" xml:space="preserve"><tspan x="196.0" y="507.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="507.5" fill="#a9b1d6">    p / [ / ] (Tab 3)   : Set period window (p) &amp; cycle chat&#39;s saved          </tspan><tspan x="813.8" y="507.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="525.5" xml:space="preserve"><tspan x="196.0" y="525.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="525.5" fill="#a9b1d6">  archives ([ / ])                                                            </tspan><tspan x="813.8" y="525.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="543.5" xml:space="preserve"><tspan x="196.0" y="543.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="543.5" fill="#a9b1d6">    o / d (Tab 3)       : Open archive in Finder (o) or delete archive (d)    </tspan><tspan x="813.8" y="543.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="561.5" xml:space="preserve"><tspan x="196.0" y="561.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="561.5" fill="#a9b1d6">    c / C / L           : AI Engine config (c), Global settings (C), QR       </tspan><tspan x="813.8" y="561.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="579.5" xml:space="preserve"><tspan x="196.0" y="579.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="579.5" fill="#a9b1d6">  Login (L)                                                                   </tspan><tspan x="813.8" y="579.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="597.5" xml:space="preserve"><tspan x="196.0" y="597.5" fill="#79a2f7">║</tspan><tspan x="203.9" y="597.5" fill="#a9b1d6">    q / Esc             : Quit or close modal                                 </tspan><tspan x="813.8" y="597.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="615.5" xml:space="preserve"><tspan x="196.0" y="615.5" fill="#79a2f7">║</tspan><tspan x="813.8" y="615.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="633.5" xml:space="preserve"><tspan x="196.0" y="633.5" fill="#79a2f7">╚══════════════════════════════════════════════════════════════════════════════╝</tspan></text>
    <text class="mono" x="24.0" y="651.5" xml:space="preserve"></text>
    <text class="mono" x="24.0" y="669.5" xml:space="preserve"></text>
    <text class="mono" x="24.0" y="687.5" xml:space="preserve"></text>
  </g>
</svg>
