    <text class="mono" x="24.0" y="489.5" xml:space="preserve"><tspan x="125.7" y="489.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="489.5" fill="#c0caf5">## 1. Rolling Window &amp; Deduplication Rules</tspan><tspan x="884.2" y="489.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="507.5" xml:space="preserve"><tspan x="125.7" y="507.5" fill="#79a2f7">║</tspan><tspan x="884.2" y="507.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="525.5" xml:space="preserve"><tspan x="125.7" y="525.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="525.5" fill="#c0caf5">### Rule 1: Self-Contained 35-Day Rolling Window</tspan><tspan x="884.2" y="525.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="543.5" xml:space="preserve"><tspan x="125.7" y="543.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="543.5" fill="#c0caf5">- Inspect timestamps across all provided messages, voice transcripts, and attachments, and</tspan><tspan x="884.2" y="543.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="561.5" xml:space="preserve"><tspan x="125.7" y="561.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="561.5" fill="#c0caf5">restrict active analysis to the **last 35 calendar days** ending on the actual run date /</tspan><tspan x="884.2" y="561.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="579.5" xml:space="preserve"><tspan x="125.7" y="579.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="579.5" fill="#c0caf5">latest message timestamp (`window_end`). Do NOT clamp `window_end` to the 7th if post-7th</tspan><tspan x="884.2" y="579.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="597.5" xml:space="preserve"><tspan x="125.7" y="597.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="597.5" fill="#c0caf5">settlement transfers occurred.</tspan><tspan x="884.2" y="597.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="615.5" xml:space="preserve"><tspan x="125.7" y="615.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="615.5" fill="#c0caf5">- The contractual billing cycle begins on the **7th of each month** (`7th of Month N`</tspan><tspan x="884.2" y="615.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="633.5" xml:space="preserve"><tspan x="125.7" y="633.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="633.5" fill="#c0caf5">through `6th of Month N+1`). The 35-day lookback provides a 4–5 day overlap threshold prior</tspan><tspan x="884.2" y="633.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="651.5" xml:space="preserve"><tspan x="125.7" y="651.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="651.5" fill="#c0caf5">to the 7th to capture boundary payments and late-posted utility bills.</tspan><tspan x="884.2" y="651.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="669.5" xml:space="preserve"><tspan x="125.7" y="669.5" fill="#79a2f7">║</tspan><tspan x="884.2" y="669.5" fill="#79a2f7">║</tspan></text>
