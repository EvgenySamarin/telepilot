    <text class="mono" x="24.0" y="363.5" xml:space="preserve"><tspan x="125.7" y="363.5" fill="#79a2f7">║</tspan><tspan x="884.2" y="363.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="381.5" xml:space="preserve"><tspan x="125.7" y="381.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="381.5" fill="#c0caf5">Extract and consolidate **strictly confirmed primary financial transactions** (charges,</tspan><tspan x="884.2" y="381.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="399.5" xml:space="preserve"><tspan x="125.7" y="399.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="399.5" fill="#c0caf5">payments, expenses, and offsets) for residential property rental settlements from chat</tspan><tspan x="884.2" y="399.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="417.5" xml:space="preserve"><tspan x="125.7" y="417.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="417.5" fill="#c0caf5">histories, voice message transcripts, utility bills, and payment confirmations.</tspan><tspan x="884.2" y="417.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="435.5" xml:space="preserve"><tspan x="125.7" y="435.5" fill="#79a2f7">║</tspan><tspan x="884.2" y="435.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="453.5" xml:space="preserve"><tspan x="125.7" y="453.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="453.5" fill="#c0caf5">---</tspan><tspan x="884.2" y="453.5" fill="#79a2f7">║</tspan></text>
