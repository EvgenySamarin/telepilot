    <text class="mono" x="24.0" y="201.5" xml:space="preserve"><tspan x="125.7" y="201.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="201.5" fill="#e0af68">Description : Consolidates verified residential rental charges, security deposits, utility</tspan><tspan x="884.2" y="201.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="219.5" xml:space="preserve"><tspan x="125.7" y="219.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="219.5" fill="#e0af68">bills (ЖКУ), and repair/expense offsets over a 35-day rolling window (anchored to the 7th of</tspan><tspan x="884.2" y="219.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="237.5" xml:space="preserve"><tspan x="125.7" y="237.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="237.5" fill="#e0af68">each month) with strict deduplication against prior statements and self-generated statement</tspan><tspan x="884.2" y="237.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" x="24.0" y="255.5" xml:space="preserve"><tspan x="125.7" y="255.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="255.5" fill="#e0af68">PDFs, outputting atomic signed events (+ / -) in JSON for downstream validation and landing</tspan><tspan x="884.2" y="255.5" fill="#79a2f7">║</tspan></text>
