    <text class="mono" y="273.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="152.0" textLength="736.0" lengthAdjust="spacing" fill="#7aa2f7">────────────────────────────────────────────────────────────────────────────────────────────</tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="291.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  Extract a decision log. Only include what was actually agreed; never speculate.               </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="309.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="327.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  - executive_summary: one sentence on how many decisions were made and the main area they      </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="345.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  affect.                                                                                       </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="363.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  - key_decisions: numbered list: &#34;N. Decision — owner — date — evidence (#message_id or file   </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="381.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  name)&#34;.                                                                                       </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="399.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  - voice_media_insights: bullet list (&#34;• &#34;) of the voice notes / files where a decision was    </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="417.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  made or justified.                                                                            </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
    <text class="mono" y="435.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="136.0" textLength="768.0" lengthAdjust="spacing" fill="#c0caf5">  - action_items: checklist (&#34;[ ] owner: task (deadline)&#34;) that follows directly from the       </tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
