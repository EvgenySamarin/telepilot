    <text class="mono" xml:space="preserve"><tspan x="125.7" y="219.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="219.5" fill="#e0af68">Description : Strict log of decisions, owners, and evidence only</tspan><tspan x="884.2" y="219.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="237.5" fill="#79a2f7">║</tspan><tspan x="884.2" y="237.5" fill="#79a2f7">║</tspan></text>
