    <text class="mono" xml:space="preserve"><tspan x="125.7" y="273.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="273.5" fill="#3b4161">────────────────────────────────────────────────────────────────────────────────────────────</tspan><tspan x="884.2" y="273.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="291.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="291.5" fill="#c0caf5">Extract a decision log. Only include what was actually agreed; never speculate.</tspan><tspan x="884.2" y="291.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="309.5" fill="#79a2f7">║</tspan><tspan x="884.2" y="309.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="327.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="327.5" fill="#c0caf5">- executive_summary: one sentence on how many decisions were made and the main area they</tspan><tspan x="884.2" y="327.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="345.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="345.5" fill="#c0caf5">affect.</tspan><tspan x="884.2" y="345.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="363.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="363.5" fill="#c0caf5">- key_decisions: numbered list: &#34;N. Decision — owner — date — evidence (#message_id or file</tspan><tspan x="884.2" y="363.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="381.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="381.5" fill="#c0caf5">name)&#34;.</tspan><tspan x="884.2" y="381.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="399.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="399.5" fill="#c0caf5">- voice_media_insights: bullet list (&#34;• &#34;) of the voice notes / files where a decision was</tspan><tspan x="884.2" y="399.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="417.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="417.5" fill="#c0caf5">made or justified.</tspan><tspan x="884.2" y="417.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="435.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="435.5" fill="#c0caf5">- action_items: checklist (&#34;[ ] owner: task (deadline)&#34;) that follows directly from the</tspan><tspan x="884.2" y="435.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="453.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="453.5" fill="#c0caf5">decisions.</tspan><tspan x="884.2" y="453.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="471.5" fill="#79a2f7">║</tspan><tspan x="884.2" y="471.5" fill="#79a2f7">║</tspan></text>
    <text class="mono" xml:space="preserve"><tspan x="125.7" y="489.5" fill="#79a2f7">║</tspan><tspan x="149.1" y="489.5" fill="#c0caf5">If nothing was decided, say so explicitly in key_decisions. Write in the dominant language</tspan><tspan x="884.2" y="489.5" fill="#79a2f7">║</tspan></text>
