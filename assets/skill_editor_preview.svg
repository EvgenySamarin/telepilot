    <text class="mono" y="219.5" xml:space="preserve"><tspan x="128.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan><tspan x="152.0" textLength="512.0" lengthAdjust="spacing" fill="#e0af68">Description : Strict log of decisions, owners, and evidence only</tspan><tspan x="904.0" textLength="8.0" lengthAdjust="spacing" fill="#79a2f7">║</tspan></text>
