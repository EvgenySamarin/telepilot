name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Resolve version tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in "darwin/arm64" "darwin/amd64" "linux/amd64"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="dist/stage_${GOOS}_${GOARCH}"
            mkdir -p "$STAGE"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w -X main.version=${TAG#v}" -o "$STAGE/telepilot" ./cmd/tgp
            cp "$STAGE/telepilot" "$STAGE/tgp"
            cp README.md LICENSE "$STAGE/"
            tar -C "$STAGE" -czf "dist/telepilot_${TAG}_${GOOS}_${GOARCH}.tar.gz" telepilot tgp README.md LICENSE
            rm -rf "$STAGE"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TelePilot ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
